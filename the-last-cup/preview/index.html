<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Last Cup</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,400&family=Jost:wght@400;500&display=swap"
    />
    <style>
      /* Layout: a lit counter at night. The vertical film is the lamp-lit object; text sits around it like tasting notes. */
      :root {
        color-scheme: dark;
        --night: #120d09; /* the room behind the counter */
        --panel: #1b140e; /* lacquer */
        --ivory: #efe7d6; /* type, washi */
        --muted: #b7a98f; /* secondary notes */
        --celadon: #a9bea0; /* the cup's glaze: accent */
        --ochre: #c9a46a; /* lamp light */
        --rule: #3a2d22;
        --seal: #a8342a;
        --display: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
        --body: 'Jost', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
      }
      html,
      body {
        background: var(--night);
        color: var(--ivory);
      }
      body {
        font-family: var(--body);
        font-size: 15px;
        line-height: 1.55;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-block: 28px 40px;
      }
      main {
        max-width: 1040px;
        margin: 0 auto;
        display: grid;
        gap: 28px;
      }
      header {
        display: grid;
        gap: 10px;
        max-width: 62ch;
      }
      .eyebrow {
        margin: 0;
        font-size: 12px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--ochre);
      }
      h1 {
        margin: 0;
        font-family: var(--display);
        font-weight: 300;
        font-size: clamp(44px, 7vw, 76px);
        line-height: 1;
        letter-spacing: 0.08em;
        text-wrap: balance;
      }
      .lede {
        margin: 0;
        color: var(--muted);
        font-family: var(--display);
        font-style: italic;
        font-size: 20px;
        line-height: 1.45;
      }
      .tabs {
        display: flex;
        gap: 22px;
        margin-top: 8px;
        border-bottom: 1px solid var(--rule);
      }
      .tabs a {
        color: var(--muted);
        text-decoration: none;
        font-size: 13px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        padding: 10px 0;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
      }
      .tabs a.on {
        color: var(--ivory);
        border-bottom-color: var(--celadon);
      }
      .tabs a:focus-visible,
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--celadon);
        outline-offset: 3px;
      }
      .stage {
        display: grid;
        grid-template-columns: minmax(0, auto) minmax(0, 1fr);
        gap: 36px;
        align-items: start;
      }
      .screen {
        position: relative;
        height: min(78vh, 860px);
        aspect-ratio: 9 / 16;
        max-width: 100%;
        background: #000;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px var(--rule);
      }
      .screen.explore {
        background: var(--panel);
      }
      .hint {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 10px;
        margin: 0;
        font-size: 12px;
        color: var(--muted);
        text-shadow: 0 1px 8px #000;
        pointer-events: none;
      }
      .chapters {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        border-top: 1px solid var(--rule);
      }
      .chapters button {
        width: 100%;
        text-align: left;
        display: grid;
        grid-template-columns: 64px 1fr;
        column-gap: 16px;
        padding: 16px 4px;
        background: none;
        border: 0;
        border-bottom: 1px solid var(--rule);
        color: var(--ivory);
        font: inherit;
        cursor: pointer;
      }
      .chapters .tc {
        grid-row: span 2;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        font-size: 13px;
        padding-top: 4px;
      }
      .chapters .nm {
        font-family: var(--display);
        font-size: 24px;
        line-height: 1.2;
      }
      .chapters .nt {
        color: var(--muted);
        font-size: 13.5px;
      }
      .chapters button.on .nm {
        color: var(--celadon);
      }
      .chapters button.on .tc {
        color: var(--ochre);
      }
      .chapters button:hover .nm {
        color: var(--ivory);
        text-decoration: underline;
        text-decoration-color: var(--rule);
        text-underline-offset: 5px;
      }
      .scrub {
        display: grid;
        gap: 14px;
      }
      .scrub label {
        font-size: 12px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--ochre);
      }
      .scrub input {
        width: 100%;
        accent-color: var(--celadon);
      }
      .marks {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .marks button {
        background: var(--panel);
        color: var(--ivory);
        border: 1px solid var(--rule);
        padding: 7px 12px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .marks button:hover {
        border-color: var(--celadon);
      }
      .aside {
        margin: 0;
        color: var(--muted);
        font-size: 13.5px;
        max-width: 48ch;
      }
      footer {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 28px;
        padding-top: 16px;
        border-top: 1px solid var(--rule);
        color: var(--muted);
        font-size: 12.5px;
        letter-spacing: 0.06em;
      }
      footer .jp {
        margin-left: auto;
        color: var(--ochre);
      }
      @media (max-width: 760px) {
        .stage {
          grid-template-columns: minmax(0, 1fr);
        }
        .screen {
          height: auto;
          width: 100%;
        }
        footer .jp {
          margin-left: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
