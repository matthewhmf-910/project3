/* ---------------- math / easing ---------------- */

  inOutQuart: t => t < .5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2,

  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),

  inOutExpo: t => t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,

/* ======================= GLASS RIG (shared by most shots) ======================= */
const GH = 1.15, HB = 0.075;

function ellPts(r, h, a0 = 0, a1 = TAU, n = 48) { const p = []; for (let i = 0; i <= n; i++) { const a = lerp(a0, a1, i / n); p.push(P(Math.cos(a) * r, h, Math.sin(a) * r)); } return p; }

  BA = mk(W, H); BB = mk(W, H); PORTAL = mk(W, H); SUB = mk(W, H); sctx = SUB.getContext('2d');

  CAM = camAt(3.125); const f0 = scr(proj(fp(FC, .3, .15))), f1 = scr(proj(fp(FC, 3.7, .15))); WW_END = Math.hypot(f1[0] - f0[0], f1[1] - f0[1]);
}
window.READY = init().then(() => { window.renderFrame = renderFrame; return true; });
if (!/render/.test(location.search)) {
