<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Flipbook</title>
<style>
  :root { --bg: #F6F6F6; }
  html, body { margin: 0; background: var(--bg); }
  body.capture { overflow: hidden; }
  .track { position: relative; }
  .sticky { position: sticky; top: 0; height: 100vh; display: grid; place-items: center; overflow: hidden; }
  .scaler { transform-origin: 50% 50%; }
  body.capture .sticky { height: auto; display: block; }
  body.capture .scaler { transform: none !important; }
</style>
</head>
<body>
<div class="track" id="track">
  <div class="sticky"><div class="scaler" id="scaler"><div id="stage"></div></div></div>
</div>
<script src="flipbook.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const tex = (q.get('tex') || 'assets/ref/').replace(/\/?$/, '/');
  const pages = {
    logo: tex + 'logo.png',
    spreads: Array.from({ length: 10 }, (_, s) => ({
      upper: s === 0 ? null : `${tex}S${s}_upper.png`,
      lower: `${tex}S${s}_lower.png`,
    })),
  };
  const R = window.__R = Flipbook.build(document.getElementById('stage'), pages);
  const END = Flipbook.END_FRAME;

  if (q.has('frame')) {
    // Deterministic single-frame render for capture / validation.
    document.body.classList.add('capture');
    Flipbook.render(R, parseFloat(q.get('frame')));
  } else if (q.has('play')) {
    document.body.classList.add('capture');
    const t0 = performance.now();
    const tick = (now) => {
      const f = Math.min(((now - t0) / 1000) * Flipbook.FPS, END);
      Flipbook.render(R, f);
      if (f < END) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  } else {
    // Scroll-driven: scroll distance maps linearly to source time, so a constant scroll speed
    // reproduces the measured pacing exactly. px per frame is tunable with ?ppf=.
    const ppf = parseFloat(q.get('ppf') || '24');
    const track = document.getElementById('track'), scaler = document.getElementById('scaler');
    const fit = () => {
      const s = Math.min(innerHeight / Flipbook.G.h, innerWidth / Flipbook.G.w);
      scaler.style.transform = `scale(${s})`;
      track.style.height = `${END * ppf + innerHeight}px`;
    };
    const onScroll = () => Flipbook.render(R, Math.min(Math.max(scrollY / ppf, 0), END));
    addEventListener('resize', () => { fit(); onScroll(); });
    addEventListener('scroll', onScroll, { passive: true });
    fit(); onScroll();
  }
</script>
</body>
</html>
