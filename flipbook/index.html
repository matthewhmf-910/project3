<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Flipbook</title>
<style>
  :root { --bg: #F6F6F6; }
  html, body { margin: 0; background: var(--bg); }
  body.capture { overflow: hidden; }
  .track { position: relative; }
  .sticky { position: sticky; top: 0; height: 100vh; display: grid; place-items: center; overflow: hidden; }
  .scaler { transform-origin: 50% 50%; }
  body.capture .sticky { height: auto; display: block; }
  body.capture .scaler { transform: none !important; }
  body.play .sticky { height: 100vh; display: grid; }
  .modes { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 6px; font: 500 12px/1 system-ui, sans-serif; }
  .modes a { padding: 8px 12px; border-radius: 999px; background: #fff; color: #181916; text-decoration: none; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .modes a[aria-current] { background: #181916; color: #fff; }
  body.capture .modes { display: none; }
</style>
</head>
<body>
<div class="track" id="track">
  <div class="sticky"><div class="scaler" id="scaler"><div id="stage"></div></div></div>
</div>
<nav class="modes"><a href="?" id="m-scroll">Scroll</a><a href="?play" id="m-play">Play</a></nav>
<script src="flipbook.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const tex = (q.get('tex') || 'assets/ref/').replace(/\/?$/, '/');
  // build_standalone.py inlines textures as window.FB_TEXTURES (same shape as below).
  const pages = window.FB_TEXTURES || {
    logo: tex + 'logo.png',
    spreads: Array.from({ length: 10 }, (_, s) => ({
      upper: s === 0 ? null : `${tex}S${s}_upper.png`,
      lower: `${tex}S${s}_lower.png`,
    })),
  };
  const R = window.__R = Flipbook.build(document.getElementById('stage'), pages);
  const END = Flipbook.END_FRAME;

  if (q.has('frame')) {
    // Deterministic single-frame render for capture / validation.
    document.body.classList.add('capture');
    Flipbook.render(R, parseFloat(q.get('frame')));
  } else if (q.has('play')) {
    // Autoplay at source speed, looping with a 1s pause on the last frame.
    document.body.classList.add('play');
    document.getElementById('m-play').setAttribute('aria-current', 'page');
    const scaler = document.getElementById('scaler');
    const fit = () => { scaler.style.transform = `scale(${Math.min(innerHeight / Flipbook.G.h, innerWidth / Flipbook.G.w)})`; };
    addEventListener('resize', fit); fit();
    let t0 = performance.now();
    const tick = (now) => {
      const t = (now - t0) / 1000;
      Flipbook.render(R, Math.min(t * Flipbook.FPS, END));
      if (t > END / Flipbook.FPS + 1) t0 = now;
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  } else {
    document.getElementById('m-scroll').setAttribute('aria-current', 'page');
    // Scroll-driven: scroll distance maps linearly to source time, so a constant scroll speed
    // reproduces the measured pacing exactly. px per frame is tunable with ?ppf=.
    const ppf = parseFloat(q.get('ppf') || '24');
    const track = document.getElementById('track'), scaler = document.getElementById('scaler');
    const fit = () => {
      const s = Math.min(innerHeight / Flipbook.G.h, innerWidth / Flipbook.G.w);
      scaler.style.transform = `scale(${s})`;
      track.style.height = `${END * ppf + innerHeight}px`;
    };
    const onScroll = () => Flipbook.render(R, Math.min(Math.max(scrollY / ppf, 0), END));
    addEventListener('resize', () => { fit(); onScroll(); });
    addEventListener('scroll', onScroll, { passive: true });
    fit(); onScroll();
  }
</script>
</body>
</html>
