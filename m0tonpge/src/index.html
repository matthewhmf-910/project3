<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Corner Kiosk Lemon Coffee</title>
<link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-tc/600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-sans-tc/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-sans-tc/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/fraunces/400-italic.css">
<style>
  :root {
    --paper: #efe7da;
    --ink: #2a1d15;
    --wood: #6b4428;
    --muted: #8a7a68;
    --lemon: #e8c547;   /* the single accent */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--paper); overflow: hidden; }
  #frame { position: relative; overflow: hidden; background: var(--paper); }
  #stage { position: absolute; overflow: hidden; background: #1a130e; }
  .shot { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform, opacity; }
  #scrim { position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none;
           background: linear-gradient(to bottom, rgba(26,19,14,0) 0%, rgba(26,19,14,.55) 55%, rgba(26,19,14,.82) 100%); }
  #scrimTop { position: absolute; left: 0; right: 0; top: 0; height: 26%; pointer-events: none; opacity: 0;
              background: linear-gradient(to top, rgba(26,19,14,0) 0%, rgba(26,19,14,.6) 60%, rgba(26,19,14,.78) 100%); }
  body.split #scrimTop { display: none; }
  #ring { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  #disc { position: absolute; border-radius: 50%; overflow: hidden; }
  #disc img { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

  #copy { position: absolute; }
  .line { position: absolute; left: 0; right: 0; will-change: transform, opacity; }
  .kicker { font: 500 var(--k) / 1.2 "Noto Sans TC", sans-serif; letter-spacing: .22em; text-transform: uppercase; }
  .zh { font: 600 var(--h) / 1.25 "Noto Serif TC", serif; letter-spacing: .04em; }
  .en { font: italic 400 var(--e) / 1.3 "Fraunces", serif; margin-top: .55em; opacity: .85; }
  .dot { display: inline-block; width: .42em; height: .42em; border-radius: 50%; background: var(--lemon);
         vertical-align: .18em; margin-right: .5em; }

  /* Format: text over photo (9:16, 1:1) */
  body.over #copy { color: #f6efe3; }
  body.over .kicker { color: #e9dcc6; }
  /* Format: split, text on paper (16:9) */
  body.split #copy { color: var(--ink); }
  body.split .kicker { color: var(--wood); }
  body.split #scrim { display: none; }
</style>
</head>
<body>
<div id="frame">
  <div id="stage">
    <img class="shot" id="s1" src="assets/corner_render.png">
    <img class="shot" id="s2" src="assets/chairs_corner.png">
    <img class="shot" id="s3" src="assets/table_lemon.jpg">
    <div id="scrim"></div>
    <div id="scrimTop"></div>
    <div id="disc"><img id="s4" src="assets/drink_top.jpg"></div>
    <svg id="ring"><circle id="ringc" fill="none" stroke-linecap="round"/></svg>
  </div>
  <div id="copy">
    <div class="line" id="c1"><div class="kicker">Zhongshan · Taipei</div><div class="zh">一間店，可以多小？</div><div class="en">How small can a café be?</div></div>
    <div class="line" id="c2"><div class="kicker">The seating</div><div class="zh">兩張長木椅。</div><div class="en">Two wooden chairs.</div></div>
    <div class="line" id="c3"><div class="kicker">The table</div><div class="zh">一張圓鐵桌。</div><div class="en">One round iron table.</div></div>
    <div class="line" id="c4"><div class="kicker">The menu</div><div class="zh">小到，只賣一杯。</div><div class="en">Small enough to sell one cup.</div></div>
    <div class="line" id="c5"><div class="kicker"><span class="dot"></span>Lemon · Iced coffee</div><div class="zh">冰咖啡，一片檸檬。</div><div class="en">Iced coffee, one slice of lemon.</div></div>
    <div class="line" id="c6"><div class="kicker">中山 · 街角木屋</div><div class="zh">剛剛好。</div><div class="en">Just enough.</div></div>
  </div>
</div>
<script src="timeline.js"></script>
</body>
</html>
